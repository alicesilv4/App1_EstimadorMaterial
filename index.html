<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Classificador Vetorial de Alvenaria</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Classificador Vetorial de Alvenaria</h1>
        <p class="descricao">
            Classificação baseada em vetores ℝ⁴ usando produto interno, norma
            e similaridade do cosseno.
        </p>

        <div class="form">
            <div class="campo">
                <label>Altura (m)</label>
                <input type="number" id="altura" step="0.01">
            </div>

            <div class="campo">
                <label>Comprimento (m)</label>
                <input type="number" id="comprimento" step="0.01">
            </div>

            <div class="campo">
                <label>Espessura (m)</label>
                <input type="number" id="espessura" step="0.01">
            </div>

            <div class="campo">
                <label>Carga estimada (kN)</label>
                <input type="number" id="carga" step="1">
            </div>

            <button onclick="classificar()">Classificar Parede</button>
        </div>

        <div id="resultado" class="resultado oculto"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
